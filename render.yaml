services:
  - type: web
    name: lifeguard-timesheet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8765"
      - key: DATA_DIR
        value: /app/data
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: lifeguard-db
      mountPath: /app/data
      sizeGB: 1
