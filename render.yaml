services:
  - type: web
    name: lifeguard-timesheet
    runtime: node
    plan: free
    buildCommand: "npm install || true"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: "20"
    disk:
      name: lifeguard-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
